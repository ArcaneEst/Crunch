name: Deploy Crunch

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Quartz/package-lock.json  # Указываем путь к lock-файлу внутри папки Quartz

      - name: Install dependencies
        working-directory: Quartz  # Переходим в папку Quartz
        run: npm ci

      - name: Build Quartz
        working-directory: Quartz  # Собираем проект внутри папки Quartz
        run: npx quartz build

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: Quartz/public  # Забираем результат сборки из папки Quartz/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4