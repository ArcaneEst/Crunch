      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json # Убрали Quartz/

      - name: Install dependencies
        run: npm ci # Убрали working-directory: Quartz

      - name: Build Quartz
        run: npx quartz build # Убрали working-directory: Quartz

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public # Убрали Quartz/